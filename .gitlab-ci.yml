run_v2ray:
  image: ubuntu:latest
  variables:
    nginx_seq: "0"
    cloudflared_token: ""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: manual
  script:
    - apt-get update && apt-get install -y sudo wget unzip curl lsof nginx openssh-server git perl netcat-openbsd
    - chmod +x run_v2ray.sh
    - ./run_v2ray.sh
    - |
      start_time=$(date +%s)
      timeout=1800
      while true; do
        current_time=$(date +%s)
        elapsed=$((current_time - start_time))
        if [ "$elapsed" -ge "$timeout" ]; then
          echo "循环已执行${elapsed}秒，退出"
          break
        fi
        echo "运行中... 已过时间：${elapsed}秒"
        sleep 10
      done
